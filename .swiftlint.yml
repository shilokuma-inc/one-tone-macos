# SwiftLint は UI コードへの日本語の直書きを見つけるためだけに使う（Discussion #121）。
# 既定ルールは有効にしない（既存コードの整形は対象外）。
included:
  - OneTone
only_rules:
  - hardcoded_japanese_string
custom_rules:
  hardcoded_japanese_string:
    name: "日本語のハードコード文言"
    # ソース言語は英語なので、UI に出る文言に日本語が直接書かれていれば誤り。
    # 日本語は OneTone/Localizable.xcstrings に訳として入れる。
    #
    # 「文字列リテラルに日本語があれば違反」にすると、翻訳対象ではないもの
    # （#Preview の名前、開発者向けのログ、precondition のメッセージ）まで拾ってノイズになる。
    # そのため **文言を受け取る API に直接渡している日本語** に絞っている（otanecho-ios と同じ考え方）。
    regex: '(?:(?:Text|Button|Label|TextField|Toggle|Picker|Section|Menu|ContentUnavailableView|navigationTitle|alert|confirmationDialog|help|accessibilityLabel|accessibilityValue|accessibilityHint|displayName|description|prompt)\(|localized:)\s*"[^"\n]*[ぁ-んァ-ヶ一-龥]'
    message: "UI に出る文言は String Catalog 経由にしてください（Text / LocalizedStringResource / String(localized:) にソースの英語を書き、日本語は訳として入れる）。"
    severity: warning
